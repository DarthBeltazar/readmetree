version: 1
exclude:
  - tests/fixtures/
force_include: []
collapse_siblings: []
entries:
  .github/:
    description: ""
  .github/workflows/:
    description: ""
  .github/workflows/tests.yml:
    description: "GitHub Actions: run pytest on push/PR to main (Python 3.9 and 3.12)"
  src/:
    description: ""
  src/readmetree/:
    description: ""
  src/readmetree/commands/:
    description: "generate/edit command orchestration"
  src/readmetree/commands/__init__.py:
    description: ""
  src/readmetree/commands/_shared.py:
    description: "shared plumbing: ignore-aware scan (honors per-entry ignore: true), comment map, path-arg normalization"
  src/readmetree/commands/edit.py:
    description: "readmetree edit <path>: point-edit one description; no path launches an arrow-key browser"
  src/readmetree/commands/generate.py:
    description: "readmetree generate: full scan, diff against config, prompt for new paths, update README.md; --check for CI"
  src/readmetree/commands/remove.py:
    description: "readmetree remove <path> / rm: hide a path from the tree (ignore: true) without deleting it; --restore undoes it"
  src/readmetree/__init__.py:
    description: "package version"
  src/readmetree/cli.py:
    description: "argparse entry point; forces UTF-8 stdout/stderr for legacy-codepage Windows consoles"
  src/readmetree/config.py:
    description: ".readmetree.yml model: load/save/serialize (ruamel.yaml round-trip) and diff against a scan"
  src/readmetree/defaults.py:
    description: "always-ignored paths, README markers, header/source extension-pair whitelist"
  src/readmetree/ignore.py:
    description: "path filtering: .gitignore, always-excluded paths, and git-tracked-files-only"
  src/readmetree/model.py:
    description: "tree dataclasses: FileNode, DirNode, CollapsedGroupNode"
  src/readmetree/pairing.py:
    description: "merges Vec3.h + Vec3.cpp into one Vec3.h/.cpp tree line"
  src/readmetree/prompt.py:
    description: "interactive prompting (questionary), the arrow-key browse menu, and console output (rich)"
  src/readmetree/readme_io.py:
    description: "finds the tree:start/tree:end markers and splices the rendered tree into README.md"
  src/readmetree/render.py:
    description: "pure DirNode-tree -> ASCII tree-art renderer, comment column aligned per nesting depth"
  src/readmetree/rootfind.py:
    description: "locates the project root (nearest ancestor with .git, else cwd)"
  src/readmetree/scanner.py:
    description: "walks the filesystem, applies ignore rules, merges pairs/collapsed groups, sorts the tree"
  tests/:
    description: ""
  tests/conftest.py:
    description: "pytest fixture: a fresh tmp_path copy of the example project fixture"
  tests/test_check.py:
    description: "generate --check: non-interactive, writes nothing, correct exit code"
  tests/test_config_diff.py:
    description: ".readmetree.yml load/save round-trip and new/removed/kept diffing"
  tests/test_e2e_generate.py:
    description: "full CLI runs (generate/edit) against the example project fixture"
  tests/test_manual_ignore.py:
    description: "ignore: true on a config entry actually excludes the path (and its pair) from the scan"
  tests/test_pairing.py:
    description: "header/source pair merging rules"
  tests/test_prompt_fallback.py:
    description: "plain input() fallback when questionary can't attach to a console"
  tests/test_readme_markers.py:
    description: "tree:start/tree:end marker splicing, including CRLF and error cases"
  tests/test_remove_command.py:
    description: "readmetree remove/rm/--restore: hide/restore a path, pair-awareness, force-preseeding, errors"
  tests/test_render_idempotent.py:
    description: "ASCII tree rendering, comment-column alignment, idempotency"
  tests/test_scanner_ignore.py:
    description: "git-tracked-files filtering, worktree .git-as-file, untracking keeps the description"
  tests/test_scanner_pruning.py:
    description: "empty directories (including cascaded-empty ones) are dropped from the tree"
  .pre-commit-hooks.yaml:
    description: "defines the readmetree-check hook for other repos' pre-commit configs"
  LICENSE:
    description: "MIT license"
  pyproject.toml:
    description: "package metadata, dependencies, the readmetree console-script entry point"
  README.ru.md:
    description: "hand-translated Russian README (may lag behind README.md)"
  requirements.txt:
    description: "dependencies for local development (mirrors pyproject.toml, plus pytest)"
